[mutmut]
source_paths =
    todo_app
    tracker
do_not_mutate =
    tracker/adapters/*
    tracker/entrypoints/*
    tracker/bootstrap.py
mutate_only_covered_lines = true
use_git_change_detection = false
pytest_add_cli_args_test_selection =
    tests/test_service.py
    tests/test_lifecycle_scenarios.py
    tests/test_tracker_services.py
    tests/test_tracker_model.py
also_copy =
    proof
