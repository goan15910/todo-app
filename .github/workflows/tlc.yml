name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tlc:
    name: TLC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Download TLC
        run: |
          curl -fsSL -o tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  tla2tools.jar" | sha256sum -c -

      - name: Run TLC
        run: java -XX:+UseParallelGC -jar tla2tools.jar -metadir tlc-meta spec/TodoTask.tla

  tests:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest discover -s tests

  mutation:
    name: Mutation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mutmut
        run: python -m pip install mutmut==3.8.0 "pytest==8.3.5"

      - name: Mutate application code
        run: python -m mutmut run

      - name: Fail unless every mutant is killed
        run: |
          python -m mutmut export-cicd-stats
          python - <<'PY'
          import json
          stats = json.load(open("mutants/mutmut-cicd-stats.json"))
          print(stats)
          if stats["total"] < 1 or stats["killed"] != stats["total"]:
              raise SystemExit("not every mutant was killed")
          PY
